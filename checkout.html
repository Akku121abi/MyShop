<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - My Shop</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module" src="checkout.js"></script>

<style>
body{
margin:0;
padding:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

header{
background:#0a7cff;
color:#fff;
padding:15px;
text-align:center;
}

.checkout{
max-width:700px;
margin:20px auto;
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.checkout h2{
text-align:center;
}

#qrcode{
display:flex;
justify-content:center;
margin:20px 0;
}

#amountText{
text-align:center;
font-size:22px;
font-weight:bold;
color:#0a7cff;
margin-bottom:15px;
}

#payBtn{
display:block;
text-align:center;
padding:14px;
background:#0a7cff;
color:white;
text-decoration:none;
border-radius:8px;
font-size:18px;
margin-bottom:20px;
}

.checkout input,
.checkout textarea{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
box-sizing:border-box;
}

.checkout button{
width:100%;
padding:14px;
background:#28a745;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

.checkout button:hover{
background:#218838;
}
</style>

</head>

<body>

<header>
<h1>🛒 Checkout</h1>
</header>

<div class="checkout">

<h2>Complete Payment</h2>

<div id="amountText">
Loading Amount...
</div>

<div id="qrcode"></div>

<a id="payBtn" href="#">
Pay with UPI
</a>

<p style="text-align:center;font-weight:bold;">
UPI ID : skyler4567@ybl
</p>

<input
type="text"
id="name"
placeholder="Enter Your Name">

<input
type="tel"
id="mobile"
placeholder="Enter Mobile Number">

<textarea
id="address"
rows="4"
placeholder="Delivery Address"></textarea>

<input
type="text"
id="utr"
placeholder="Enter UTR / Transaction ID">

<button id="placeOrderBtn">
Place Order
</button>

</div>

</body>
</html>
