<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - My Shop</title>

<link rel="stylesheet" href="style.css">
<script type="module" src="checkout.js"></script>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:0;
padding:0;
}

header{
background:#0a7cff;
color:#fff;
padding:15px;
text-align:center;
}

.checkout{
max-width:700px;
margin:20px auto;
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.checkout h2{
text-align:center;
margin-bottom:20px;
}

.checkout img{
width:260px;
display:block;
margin:auto;
border-radius:10px;
}

.upi{
text-align:center;
font-size:18px;
font-weight:bold;
margin:15px 0;
color:#0a7cff;
word-break:break-all;
}

.checkout input,
.checkout textarea{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
box-sizing:border-box;
}

.checkout button{
width:100%;
padding:14px;
background:#0a7cff;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

.checkout button:hover{
background:#0867d8;
}
</style>

</head>

<body>

<header>
<h1>🛒 My Shop Checkout</h1>
</header>

<div class="checkout">

<h2>Complete Your Payment</h2>

<img src="payment-qr.png" alt="QR Code">

<div class="upi">
UPI ID : <b>skyler4567@ybl</b>
</div>

<input
type="text"
id="name"
placeholder="Enter Your Name">

<input
type="tel"
id="mobile"
placeholder="Enter Mobile Number">

<textarea
id="address"
rows="4"
placeholder="Enter Delivery Address"></textarea>

<input
type="file"
id="screenshot"
accept="image/*">

<button id="placeOrderBtn">
Place Order
</button>

</div>

</body>
</html>
