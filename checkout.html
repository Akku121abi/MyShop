<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - My Shop</title>

<link rel="stylesheet" href="style.css">

<script type="module" src="checkout.js"></script>

<style>
.checkout{
max-width:700px;
margin:20px auto;
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.checkout h2{
text-align:center;
margin-bottom:20px;
}

.checkout img{
width:260px;
display:block;
margin:auto;
border-radius:10px;
}

.checkout input,
.checkout textarea{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

.checkout button{
width:100%;
padding:14px;
background:#0a7cff;
color:#fff;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

.upi{
text-align:center;
font-size:18px;
font-weight:bold;
margin:15px 0;
color:#0a7cff;
}
</style>

</head
