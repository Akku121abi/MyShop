<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - My Shop</title>

<link rel="stylesheet" href="style.css">

<script type="module" src="register.js"></script>

</head>
<body>

<header>
<h1>🛒 My Shop</h1>
</header>

<div class="product">

<h2>Create Account</h2>

<input
type="email"
id="email"
placeholder="Email"
style="width:90%;padding:12px;margin:10px;border:1px solid #ccc;border-radius:6px;">

<input
type="password"
id="password"
placeholder="Password"
style="width:90%;padding:12px;margin:10px;border:1px solid #ccc;border-radius:6px;">

<button id="registerBtn">
Create Account
</button>

<p>
Already have an account?
<a href="login.html">Login</a>
</p>

</div>

</body>
</html>
