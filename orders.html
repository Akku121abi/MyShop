<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders - Admin</title>

<link rel="stylesheet" href="style.css">

<script type="module" src="orders.js"></script>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:0;
padding:0;
}

header{
background:#0a7cff;
color:#fff;
padding:15px;
text-align:center;
}

#ordersList{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
padding:20px;
}

.order{
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
width:320px;
}

.order h3{
margin:10px 0;
color:#0a7cff;
}

.order p{
margin:8px 0;
}

.order button{
width:100%;
padding:12px;
background:green;
color:#fff;
border:none;
border-radius:6px;
cursor:pointer;
font-size:16px;
}
</style>

</head>

<body>

<header>
<h1>📦 Customer Orders</h1>
</header>

<div id="ordersList">

<h2>Loading Orders...</h2>

</div>

</body>
</html>
